name: Android lint

on:
  push:
    branches: [ build/android-auto-apk ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android lint
        run: ./gradlew :lms-material:lintDebug --console=plain

      - name: Summarize lint results
        if: always()
        run: |
          report=lms-material/build/reports/lint-results-debug.txt
          echo '## Android lint results' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$report" ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Lint did not produce a text report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: lms-material/build/reports/lint-results-debug.*
          if-no-files-found: warn
